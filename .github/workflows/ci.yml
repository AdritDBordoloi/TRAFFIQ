name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tier 1 — Fast Unit Tests
        run: pytest tests/tier1_unit/ -v --tb=short

      - name: Run Tier 2 — Component Tests
        run: pytest tests/tier2_component/ -v --tb=short

      - name: Run Tier 3 — Sanitization & Memory Bounds
        run: pytest tests/tier3_sanitization/ -v --tb=short

      - name: Run Tier 4 — E2E Integration Tests
        run: pytest tests/tier4_e2e_integration/ -v --tb=short

      - name: Run Adversarial Challenger Suite
        run: pytest tests/test_adversarial_challenger.py -v --tb=short

      - name: Run Standalone Acceptance Criteria Verifier
        run: python scripts/verify_all.py
