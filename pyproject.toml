[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffiq"
version = "1.0.0"
description = "AI-Powered Automated Traffic Monitoring & E-Challan Enforcement System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "TRAFFIQ Contributors"}
]
keywords = [
    "traffic-enforcement",
    "computer-vision",
    "yolov8",
    "bytetrack",
    "easyocr",
    "smart-city",
    "intelligent-transportation",
    "e-challan",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "easyocr>=1.7.0",
    "lap>=0.5.12",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "Pillow>=9.5.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
tooling = [
    "graphifyy>=0.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "graphifyy>=0.1.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
traffiq = "traffiq.cli.app:main"

[project.urls]
Homepage = "https://github.com/traffiq-org/TRAFFIQ"
Repository = "https://github.com/traffiq-org/TRAFFIQ"
Issues = "https://github.com/traffiq-org/TRAFFIQ/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["traffiq*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
